/*
 * AI Interview Platform - Backend Application
 * Spring Boot 4.1 + Java 25 + Spring AI 2.0 + PostgreSQL + RustFS + Redis
 * （历史 Flyway 迁移仍需要 pgvector 扩展，当前业务已不使用向量库）
 */

plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.interview'
version = '0.0.1-SNAPSHOT'

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public/') }
    maven { url = uri('https://maven.aliyun.com/repository/spring/') }
    maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin/') }
    mavenCentral()
    maven { url = uri('https://repo.spring.io/milestone') }
}

dependencies {
    // P1-01: orchestration and checkpoint only; keep Spring AI unchanged.
    implementation 'org.bsc.langgraph4j:langgraph4j-core:1.9.7'
    implementation 'org.bsc.langgraph4j:langgraph4j-postgres-saver:1.9.7'

    // Spring Boot Starters (Boot 4 modular design)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // BYOK-阶段一：多用户认证与授权（Spring Security 由 Boot 4.1 BOM 统一管理版本）
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // H2 Database for testing
    testRuntimeOnly 'com.h2database:h2'

    // spring-ai-agent-utils BOM (version alignment)
    implementation platform(libs.spring.ai.agent.utils.bom)

    // Spring AI 2.0 - OpenAI兼容模式 (阿里云DashScope)
    implementation "org.springframework.ai:spring-ai-starter-model-openai:${libs.versions.springAi.get()}"
    // spring-ai-agent-utils core library
    implementation libs.spring.ai.agent.utils

    // Apache Tika for document parsing (PDF, DOCX, TXT)
    implementation libs.tika.core
    implementation libs.tika.parsers

    // AWS S3 SDK for RustFS storage
    implementation "software.amazon.awssdk:s3:${libs.versions.aws.sdk.get()}"

    // Pinyin4j - 汉字转拼音
    implementation libs.pinyin4j

    // SpringDoc OpenAPI - Swagger接口文档
    implementation libs.springdoc

    // Redisson 4.0 - Redis客户端 (Boot 4 compatible)
    implementation "org.redisson:redisson-spring-boot-starter:${libs.versions.redisson.get()}"

    // Prometheus metrics endpoint for Actuator
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // PDF导出 - iText 8
    implementation "com.itextpdf:itext-core:${libs.versions.itext.get()}"
    implementation "com.itextpdf:font-asian:${libs.versions.itext.get()}"

    // Aliyun DashScope SDK for Qwen3 ASR/TTS (replaces NLS SDK)
    implementation('com.alibaba:dashscope-sdk-java:2.22.7') {
        exclude group: 'org.slf4j', module: 'slf4j-simple' // 使用 Spring Boot 的 Logback
    }

    // Jakarta annotation for Java 21+ (replaces javax.annotation)
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // MapStruct - 对象映射 (必须在Lombok之后配置)
    implementation "org.mapstruct:mapstruct:${libs.versions.mapstruct.get()}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${libs.versions.mapstruct.get()}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.micrometer:micrometer-registry-prometheus'
    testImplementation libs.junit.jupiter
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 全局UTF-8编码配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'voice-context-eval'
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('voiceContextEvaluation', Test) {
    description = '虚构长会话的真实模型压缩对照（需 RUN_VOICE_CONTEXT_EVAL=true）'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'voice-context-eval' }
    systemProperty 'voiceEval.reportDir', layout.buildDirectory.dir('reports/voice-context-eval').get().asFile.absolutePath
    outputs.upToDateWhen { false }
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def (key, value) = trimmed.split('=', 2)
                if (System.getenv(key) == null) { environment key, value }
            }
        }
    }
}

// 将仓库根目录 .env 注入 bootRun，便于本地加载 AI_BAILIAN_API_KEY 等变量（Gradle 进程默认不读 .env）
// 同时确保 JVM 使用 UTF-8 编码
tasks.named('bootRun') {
    // 密钥重复定义会覆盖已有数据库使用的加密密钥；在启动前拒绝歧义配置。
    def seenEnvKeys = new HashSet<String>()
    // JVM 编码配置（stdout/stderr：JDK 18+，避免控制台 PrintStream 与 Logback UTF-8 不一致）
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dconsole.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '--enable-native-access=ALL-UNNAMED'
    ]

    // 加载 .env 文件
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }
            def eq = trimmed.indexOf('=')
            if (eq <= 0) {
                return
            }
            def key = trimmed.substring(0, eq).trim()
            if (!seenEnvKeys.add(key)) {
                throw new GradleException("Duplicate .env variable: ${key}; keep one active definition")
            }
            def val = trimmed.substring(eq + 1).trim()
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            environment key, val
        }
    }
}
