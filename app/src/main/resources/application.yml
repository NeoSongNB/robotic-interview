# AI Interview Platform Configuration
# 智能AI面试官平台配置

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 8080
  # 明确指定HTTP响应编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# SpringDoc OpenAPI / Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.guide.modules

spring:
  config:
    import: optional:classpath:voice-interview-opening.yml
  application:
    name: ai-interview-platform

  # 启用虚拟线程 (Java 21+)
  # 显著提升 I/O 密集型场景的并发能力，特别适合 AI 调用和 SSE 长连接
  threads:
    virtual:
      enabled: true

  # PostgreSQL数据库配置
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
    username: ${POSTGRES_USER:postgres}
    # 与 docker-compose.dev.yml 中 postgres 服务默认一致（本地只起依赖容器 + bootRun 时无需改）
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB  # 支持文件上传（简历限制在业务层检查）
      max-request-size: 50MB
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: ${REDIS_DATABASE:0}
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  
  # Spring AI 配置（chat 统一由 app.ai.providers 驱动，不使用自动配置）
  ai:
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1  # 不重试，失败立即返回
      on-client-errors: false

# Application custom configuration
app:
  # ===== BYOK 阶段一：多用户认证 =====
  auth:
    # 自助注册开关；关闭后仅管理员可创建账号
    registration-enabled: ${APP_AUTH_REGISTRATION_ENABLED:true}
    jwt:
      # 必须由环境变量提供，与 APP_AI_CONFIG_ENCRYPTION_KEY 完全独立
      secret: ${APP_AUTH_JWT_SECRET:}
      ttl: ${APP_AUTH_JWT_TTL:PT2H}
      issuer: ${APP_AUTH_JWT_ISSUER:interview-guide}
      cookie-name: IG_ACCESS_TOKEN
      cookie-enabled: ${APP_AUTH_COOKIE_ENABLED:true}
      # 生产必须 true（HTTPS）；本地 http 调试可置 false
      cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
      cookie-same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      cookie-path: /
      csrf-cookie-name: XSRF-TOKEN
      csrf-header-name: X-XSRF-TOKEN
    # 管理员受控初始化（密码只能来自环境变量，源码中无默认密码）
    admin-bootstrap:
      enabled: ${APP_AUTH_ADMIN_ENABLED:false}
      username: ${APP_AUTH_ADMIN_USERNAME:}
      password: ${APP_AUTH_ADMIN_PASSWORD:}
      email: ${APP_AUTH_ADMIN_EMAIL:}
  ai:
    default-provider: dashscope
    security:
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
      require-encryption-key: ${APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY:true}
      allow-fallback-encryption-key: ${APP_AI_CONFIG_ALLOW_FALLBACK_ENCRYPTION_KEY:false}
    # 运行时可写的 Provider 配置落点（与 classpath 主 application.yml 隔离）。
    # 开发环境默认写到用户主目录下，避免污染源码目录或 jar 内 classpath 资源。
    config-yaml-path: ${APP_AI_CONFIG_YAML_PATH:${user.home}/.interview-guide/llm-providers.yml}
    config-env-path: ${APP_AI_CONFIG_ENV_PATH:${user.home}/.interview-guide/llm-providers.env}
    agent-utils:
      skills-root: ${APP_AI_AGENT_UTILS_SKILLS_ROOT:classpath:skills}
    # ===== BYOK：用户自带密钥 =====
    byok:
      # 允许用户配置凭证的供应商白名单（Base URL 一律由服务端解析，用户不可指定）
      allowed-providers: ${APP_AI_BYOK_ALLOWED_PROVIDERS:dashscope,kimi,deepseek,glm}
      max-api-key-length: ${APP_AI_BYOK_MAX_API_KEY_LENGTH:512}
      max-model-name-length: ${APP_AI_BYOK_MAX_MODEL_NAME_LENGTH:128}
      # 用户级模型客户端缓存：按 userId::provider::model::credentialVersion 隔离，有界 + TTL
      cache:
        max-entries: ${APP_AI_BYOK_CACHE_MAX_ENTRIES:512}
        ttl: ${APP_AI_BYOK_CACHE_TTL:30m}
    # 阶段一兼容开关（阶段二起仅为历史配置保留）：用户请求已全部改为用户级凭证，
    # 该开关不再影响任何业务 AI 调用，普通用户不可能使用开发者全局 Key。
    platform-global-key-allowed: ${APP_AI_PLATFORM_GLOBAL_KEY_ALLOWED:true}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY}
        model: ${AI_MODEL:qwen3.5-flash}
      lmstudio:
        base-url: http://localhost:1234
        api-key: ${PROVIDER_LMSTUDIO_API_KEY:lm-studio}
        model: qwen2.5-7b-instruct
      # ===== 预设 Provider（填完 API Key 后即可使用）=====
      # Moonshot AI / Kimi（OpenAI 兼容） https://platform.moonshot.cn/
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
      # DeepSeek（OpenAI 兼容） https://api-docs.deepseek.com/
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
      # 智谱 AI / GLM（OpenAI 兼容） https://open.bigmodel.cn/
      glm:
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    # 结构化输出重试次数（用于 BeanOutputConverter 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    # 是否启用“修复型重试提示词”（关闭后每次重试沿用原始 system prompt）
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    # 修复型重试提示词中是否追加严格 JSON 指令
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    # 注入到重试提示词中的错误信息最大长度
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    # 是否开启结构化输出调用指标（invocations/attempts/latency）
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    # 是否启用 Spring AI 2.0 entity schema validation retry（失败时仍受 structured-max-attempts 外层控制）
    structured-schema-validation-enabled: ${APP_AI_STRUCTURED_SCHEMA_VALIDATION_ENABLED:true}

  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
      # 批次失败后按问答组二分重试（共享额外调用预算）
      fallback-split-enabled: ${APP_INTERVIEW_EVALUATION_FALLBACK_SPLIT_ENABLED:true}
      fallback-max-extra-calls: ${APP_INTERVIEW_EVALUATION_FALLBACK_MAX_EXTRA_CALLS:6}
      fallback-min-groups: ${APP_INTERVIEW_EVALUATION_FALLBACK_MIN_GROUPS:2}
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # RustFS (S3兼容) 存储配置
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:}
    secret-key: ${APP_STORAGE_SECRET_KEY:}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}
    api-call-timeout: ${APP_STORAGE_API_CALL_TIMEOUT:60s}
    api-call-attempt-timeout: ${APP_STORAGE_API_CALL_ATTEMPT_TIMEOUT:20s}
    auto-create-bucket: ${APP_STORAGE_AUTO_CREATE_BUCKET:true}

  document-parse:
    timeout: ${APP_DOCUMENT_PARSE_TIMEOUT:2m}
    pool-size: ${APP_DOCUMENT_PARSE_POOL_SIZE:2}
    queue-capacity: ${APP_DOCUMENT_PARSE_QUEUE_CAPACITY:20}
  
  # 卡住任务恢复调度（P1-07）：pending 阈值必须大于正常排队时间（消费者单线程）
  async:
    recovery:
      resume-analyze:
        enabled: ${APP_ASYNC_RECOVERY_RESUME_ENABLED:true}
        pending-threshold: ${APP_ASYNC_RECOVERY_RESUME_PENDING_THRESHOLD:10m}
        processing-threshold: ${APP_ASYNC_RECOVERY_RESUME_PROCESSING_THRESHOLD:15m}
        heartbeat-throttle: ${APP_ASYNC_RECOVERY_RESUME_HEARTBEAT_THROTTLE:30s}
        interval-ms: ${APP_ASYNC_RECOVERY_RESUME_INTERVAL_MS:60000}
        batch-size: ${APP_ASYNC_RECOVERY_RESUME_BATCH_SIZE:10}
        max-recovery-count: ${APP_ASYNC_RECOVERY_RESUME_MAX_RECOVERY_COUNT:3}

  # CORS配置 - React前端
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:80}

  # Voice interview configuration
  voice-interview:
    # 上下文压缩：enabled=false 是唯一关闭方式（仅本地排查用）；
    # enabled=true 时无论何种模式都执行字符硬预算（摘要 + 近期历史 <= max-history-chars）
    context-compression:
      enabled: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_ENABLED:true}
      mode: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_MODE:SUMMARY}
      window-size: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_WINDOW_SIZE:20}
      summary-batch-size: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_SUMMARY_BATCH_SIZE:10}
      max-history-chars: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_MAX_HISTORY_CHARS:12000}
      max-summary-chars: ${APP_VOICE_INTERVIEW_CONTEXT_COMPRESSION_MAX_SUMMARY_CHARS:4000}

    # Phase duration settings (minutes)
    phase:
      intro:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_QUESTIONS:5}
      tech:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_QUESTIONS:3}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_QUESTIONS:8}
      project:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_QUESTIONS:5}
      hr:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_QUESTIONS:5}

    # TTS configuration
    tts:
      default-voice: ${APP_VOICE_INTERVIEW_TTS_DEFAULT_VOICE:siyue}  # 思悦 - 温柔自然的女声

    # Qwen3 Realtime ASR Configuration
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: qwen3-asr-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-threshold: 0.0
        # 静音多久判为一句结束；中文面试思考停顿常见 2-3s，设 2000 避免句中切段
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}

      # Qwen TTS Realtime Configuration (WebSocket-based)
      # 音色列表文档：https://help.aliyun.com/zh/model-studio/qwen-tts-realtime
      tts:
        model: qwen3-tts-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY}
        voice: Cherry
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
        speech-rate: 1.0
        volume: 60

    # 用户说完一小段 STT 定稿后，再等多久（毫秒）才触发面试官回复；需大于 VAD 静音阈值以确保用户继续说话时 partials 能取消
    user-utterance-debounce-ms: ${APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS:2500}
    # 触发提交前要求的最小静音时长（毫秒），从最后一次 STT 活动（含 partial）算起
    min-silence-before-commit-ms: ${APP_VOICE_MIN_SILENCE_BEFORE_COMMIT_MS:2500}
    # 当内容较短时先不提交，等待继续说（字符数）
    min-commit-chars: ${APP_VOICE_MIN_COMMIT_CHARS:20}
    # 最长等待用户继续补充的时间（毫秒），超时后强制提交
    max-wait-for-continuation-ms: ${APP_VOICE_MAX_WAIT_FOR_CONTINUATION_MS:7000}
    # 语音面试单轮面试官回复最大长度（字符）
    ai-question-max-chars: ${APP_VOICE_AI_QUESTION_MAX_CHARS:120}
    # 是否按句子边合成边推送语音；开启后首段语音不用等待完整回复生成结束
    chunked-audio-enabled: ${APP_VOICE_CHUNKED_AUDIO_ENABLED:true}
    # 单句 TTS 合成超时，避免某一句卡住整轮播放
    tts-timeout-seconds: ${APP_VOICE_TTS_TIMEOUT_SECONDS:8}
    # TTS WebSocket 建连超时；必须小于单句合成超时，避免 SDK 握手失败后永久等待
    tts-connect-timeout-seconds: ${APP_VOICE_TTS_CONNECT_TIMEOUT_SECONDS:5}
    # 单会话并发 TTS 上限，控制首段语音速度和服务连接压力
    max-concurrent-tts-per-session: ${APP_VOICE_MAX_CONCURRENT_TTS_PER_SESSION:3}
    # 是否在应用启动时为开场白预热音频缓存；默认关闭，避免启动时产生云端 TTS 调用
    opening-audio-warmup-enabled: ${APP_VOICE_OPENING_AUDIO_WARMUP_ENABLED:false}

    # Rate limiting
    rate-limit:
      max-per-session: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_SESSION:10}  # messages per second
      max-per-ip: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_IP:3}  # interviews per hour
      max-concurrent: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_CONCURRENT:50}  # global concurrent interviews

    # Audio specifications
    audio:
      codec: ${APP_VOICE_INTERVIEW_AUDIO_CODEC:opus}
      sample-rate: ${APP_VOICE_INTERVIEW_AUDIO_SAMPLE_RATE:16000}
      bit-rate: ${APP_VOICE_INTERVIEW_AUDIO_BIT_RATE:24000}
      channels: ${APP_VOICE_INTERVIEW_AUDIO_CHANNELS:1}
      chunk-duration: ${APP_VOICE_INTERVIEW_AUDIO_CHUNK_DURATION:2000}  # 2 seconds

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
